<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Word Counter — QuickToolHub</title></head><body><header class="nav"><a class="brand" href="index.html"><span class="brand-mark">Q</span><span>QuickTool<span>Hub</span></span></a><nav><a href="index.html#tools">All Tools</a><a href="about.html">About</a></nav></header><main class="tool-wrap"><div class="tool-header"><span class="eyebrow">QUICKTOOLHUB TOOL</span><h1>Word Counter</h1><p>Count words, characters and sentences instantly.</p></div><section class="tool-box"><textarea id="x" class="textarea" placeholder="Paste or type your text..."></textarea><div id="r" class="result">Words: 0 · Characters: 0 · Sentences: 0</div><script>x.oninput=()=>{let t=x.value.trim(),w=t?t.split(/\s+/).length:0,s=t?(t.match(/[.!?]+(?=\s|$)/g)||[]).length:0;r.textContent=`Words: ${w} · Characters: ${x.value.length} · Sentences: ${s}`}</script></section></main><footer><div class="brand"><span class="brand-mark">Q</span><span>QuickTool<span>Hub</span></span></div><p>© 2026 QuickToolHub.</p></footer></body></html>
