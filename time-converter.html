<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Time Converter — QuickToolHub</title></head><body><header class="nav"><a class="brand" href="index.html"><span class="brand-mark">Q</span><span>QuickTool<span>Hub</span></span></a><nav><a href="index.html#tools">All Tools</a><a href="about.html">About</a></nav></header><main class="tool-wrap"><div class="tool-header"><span class="eyebrow">QUICKTOOLHUB TOOL</span><h1>Time Converter</h1><p>Convert common time units quickly.</p></div><section class="tool-box"><input id="n" class="input" type="number" placeholder="Value"><select id="u" class="input"><option>Seconds</option><option>Minutes</option><option>Hours</option></select><div class="row"><button class="action" onclick="go()">Convert</button></div><div id="r" class="result"></div><script>function go(){let v=+n.value,m=u.value; r.textContent=m==="Seconds"?`Seconds: ${v} · Minutes: ${v/60} · Hours: ${v/3600}`:m==="Minutes"?`Seconds: ${v*60} · Minutes: ${v} · Hours: ${v/60}`:`Seconds: ${v*3600} · Minutes: ${v*60} · Hours: ${v}`}</script></section></main><footer><div class="brand"><span class="brand-mark">Q</span><span>QuickTool<span>Hub</span></span></div><p>© 2026 QuickToolHub.</p></footer></body></html>
