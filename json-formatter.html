<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>JSON Formatter — QuickToolHub</title></head><body><header class="nav"><a class="brand" href="index.html"><span class="brand-mark">Q</span><span>QuickTool<span>Hub</span></span></a><nav><a href="index.html#tools">All Tools</a><a href="about.html">About</a></nav></header><main class="tool-wrap"><div class="tool-header"><span class="eyebrow">QUICKTOOLHUB TOOL</span><h1>JSON Formatter</h1><p>Format and validate JSON with readable output.</p></div><section class="tool-box"><textarea id="x" class="textarea" placeholder='{"hello":"world"}'></textarea><div class="row"><button class="action" onclick="fmt()">Format JSON</button></div><div id="r" class="result"></div><script>function fmt(){try{r.textContent=JSON.stringify(JSON.parse(x.value),null,2)}catch(e){r.textContent="Invalid JSON: "+e.message}}</script></section></main><footer><div class="brand"><span class="brand-mark">Q</span><span>QuickTool<span>Hub</span></span></div><p>© 2026 QuickToolHub.</p></footer></body></html>
